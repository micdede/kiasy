name: JarvisApp
options:
  bundleIdPrefix: de.dedecke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # in Xcode: Signing & Capabilities → Team auswählen
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  JarvisApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JarvisApp/Sources
      # .xcassets MUSS unter sources stehen (nicht resources!) — XcodeGen
      # erkennt die Endung und sortiert es automatisch in die korrekte
      # Resources-Build-Phase. Unter resources: würde es als File-Reference
      # angelegt aber nicht kompiliert (kein PBXResourcesBuildPhase).
      - path: JarvisApp/Resources/Assets.xcassets
    # resources: leer — Asset-Catalog liegt unter sources (siehe oben)
    info:
      path: JarvisApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "JARVIS braucht Zugriff aufs Mikrofon, um deine Sprachbefehle aufzunehmen."
        NSSpeechRecognitionUsageDescription: "JARVIS wandelt deine Sprache lokal in Text um, bevor er sie ans Backend schickt."
        NSLocalNetworkUsageDescription: "JARVIS verbindet sich mit deinem JARVIS-Server im lokalen Netzwerk (192.168.x.x)."
        NSBonjourServices:
          - "_jarvis._tcp"
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dedecke.jarvis
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
